# Deployed by Komodo (Build → Stack) on main-public.
# No per-app tunnel: the shared cloudflared stack reaches this by name over the
# external `web` network; a Cloudflare Public Hostname row maps
# reading.lmartins18.com -> http://book-challenge-app:3000.
# Image is built locally by Komodo Build; never pulled from a registry.
#
# Secrets (SESSION_SECRET, GOOGLE_BOOKS_API_KEY) come from the Komodo Stack's
# Environment, which Komodo writes to a .env next to this file at deploy time.
#
# Local development (publishes 3000, no tunnel):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  app:
    image: book-challenge-app:latest
    pull_policy: never
    build: ./app
    container_name: book-challenge-app
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      DATA_DIR: "/data"
      SESSION_SECRET: "${SESSION_SECRET:-dev-insecure-secret-change-me}"
      # Optional — raises Google Books quota. Works without it.
      GOOGLE_BOOKS_API_KEY: "${GOOGLE_BOOKS_API_KEY:-}"
    volumes:
      - /srv/data/book-challenge:/data
    networks:
      - web

networks:
  web:
    external: true
